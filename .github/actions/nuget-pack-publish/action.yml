name: NuGet Pack & Publish
description: Build, pack, and publish a .NET NuGet package with OIDC trusted-publisher authentication

inputs:
  project-path:
    description: 'Relative path to .csproj file'
    required: true
  tag-prefix:
    description: 'MinVer tag prefix (e.g., "sumcorev")'
    required: true
  artifact-name:
    description: 'Name for the uploaded artifact (will have -pkg suffix)'
    required: true
  version:
    description: 'Package version'
    required: true
  dotnet-version:
    description: '.NET SDK version'
    default: '10.0.x'
  dotnet-quality:
    description: '.NET SDK quality channel'
    default: 'preview'
  use-nuget-dep:
    description: 'Pass UseNuGetDependency=true and CorePackageVersion to MSBuild'
    default: 'true'
  publish-github:
    description: 'Also publish to GitHub Packages'
    default: 'false'
  publish-snupkg:
    description: 'Also push .snupkg symbol packages'
    default: 'false'
  pre-pack-build:
    description: 'Run explicit dotnet build before pack (with --no-build on pack)'
    default: 'false'
  extra-build-args:
    description: 'Extra args for the pre-pack build step'
    default: ''
  github-token:
    description: 'GitHub token for GitHub Packages (required if publish-github is true)'
    default: ''

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        dotnet-quality: ${{ inputs.dotnet-quality }}

    - name: Create version tag for MinVer
      shell: bash
      run: git tag "${{ inputs.tag-prefix }}${{ inputs.version }}" 2>/dev/null || true

    - name: Restore
      shell: bash
      run: |
        ARGS=""
        if [ "${{ inputs.use-nuget-dep }}" = "true" ]; then
          ARGS="-p:UseNuGetDependency=true -p:CorePackageVersion=${{ inputs.version }}"
        fi
        dotnet restore ${{ inputs.project-path }} $ARGS

    - name: Build (pre-pack)
      if: inputs.pre-pack-build == 'true'
      shell: bash
      run: |
        # Override GeneratePackageOnBuild to prevent .NET 10 SDK from producing
        # a package during build, which conflicts with the explicit pack step.
        ARGS="-p:GeneratePackageOnBuild=false"
        if [ "${{ inputs.use-nuget-dep }}" = "true" ]; then
          ARGS="$ARGS -p:UseNuGetDependency=true -p:CorePackageVersion=${{ inputs.version }}"
        fi
        dotnet build ${{ inputs.project-path }} \
          -c Release $ARGS ${{ inputs.extra-build-args }}

    - name: Pack
      shell: bash
      run: |
        # Override GeneratePackageOnBuild to prevent .NET 10 SDK from skipping
        # the build when this property is true in the csproj (causes NU5026).
        ARGS="-p:GeneratePackageOnBuild=false"
        if [ "${{ inputs.use-nuget-dep }}" = "true" ]; then
          ARGS="$ARGS -p:UseNuGetDependency=true -p:CorePackageVersion=${{ inputs.version }}"
        fi
        NO_BUILD=""
        if [ "${{ inputs.pre-pack-build }}" = "true" ]; then
          NO_BUILD="--no-build"
        fi
        dotnet pack ${{ inputs.project-path }} \
          -c Release -o ./artifacts $ARGS $NO_BUILD

    - name: NuGet Login (OIDC)
      id: nuget
      uses: NuGet/login@v1
      with:
        user: 'mostlylucid'

    - name: Publish to NuGet.org
      shell: bash
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols

    - name: Publish symbols
      if: inputs.publish-snupkg == 'true'
      shell: bash
      run: |
        if ls ./artifacts/*.snupkg 1>/dev/null 2>&1; then
          dotnet nuget push ./artifacts/*.snupkg \
            --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
        else
          echo "No .snupkg files found — skipping symbol publish"
        fi
      continue-on-error: true

    - name: Publish to GitHub Packages
      if: inputs.publish-github == 'true'
      shell: bash
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ inputs.github-token }} \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
      continue-on-error: true

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}-pkg
        path: ./artifacts/*
