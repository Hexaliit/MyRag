name: Publish All NuGet Packages

# Cascading publish of ALL NuGet packages:
# 0. Summarizer.Core (pure interfaces) → wait
# 1. DocSummarizer (interfaces + services) → wait
# 2. Backends (Rdbms.Sqlite, FullText.Lucene, FullText.Sqlite, Anthropic, OpenAI) parallel → wait
# 3. DoomSummarizer.Core → wait
# 4. Sources + Readers + Plugin.Books (all parallel)
# 5. DoomSummarizer.Complete (meta-package: fat CLI with everything)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for ALL packages (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  # ── Tier 0: Summarizer.Core (pure interfaces) ──────────────────────────
  publish-summarizer-core:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Create version tag for MinVer
        run: |
          TAG="sumcorev${{ github.event.inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
          fi

      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.Summarizer.Core/Mostlylucid.Summarizer.Core.csproj
          dotnet pack src/Mostlylucid.Summarizer.Core/Mostlylucid.Summarizer.Core.csproj \
            -c Release -o ./artifacts

      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: 'mostlylucid'

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        continue-on-error: true

      - uses: actions/upload-artifact@v6
        with:
          name: summarizer-core-pkg
          path: ./artifacts/*

  # ── Wait for Summarizer.Core on NuGet ──────────────────────────────────
  wait-for-summarizer-core:
    needs: publish-summarizer-core
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/mostlylucid.lucidrag.summarizer.core/${VERSION}/mostlylucid.lucidrag.summarizer.core.${VERSION}.nupkg")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Timeout — continuing anyway"

  # ── Tier 0.5: CodeSummarizer.Core ─────────────────────────────────────
  publish-codesummarizer:
    needs: [publish-summarizer-core, wait-for-summarizer-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Create version tag for MinVer
        run: |
          TAG="codesumv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true

      - name: Build & Pack
        run: |
          dotnet restore src/CodeSummarizer.Core/CodeSummarizer.Core.csproj
          dotnet build src/CodeSummarizer.Core/CodeSummarizer.Core.csproj -c Release -p:GeneratePackageOnBuild=false
          dotnet pack src/CodeSummarizer.Core/CodeSummarizer.Core.csproj \
            -c Release -o ./artifacts --no-build

      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: 'mostlylucid'

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        continue-on-error: true

      - uses: actions/upload-artifact@v6
        with:
          name: codesummarizer-pkg
          path: ./artifacts/*

  # ── Wait for CodeSummarizer ──────────────────────────────────────────
  wait-for-codesummarizer:
    needs: [publish-summarizer-core, publish-codesummarizer]
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/mostlylucid.lucidrag.codesummarizer/${VERSION}/mostlylucid.lucidrag.codesummarizer.${VERSION}.nupkg")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Timeout — continuing anyway"

  # ── Tier 1: DocSummarizer ──────────────────────────────────────────────
  publish-docsummarizer:
    needs: [publish-summarizer-core, wait-for-summarizer-core, wait-for-codesummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Create version tag for MinVer
        run: |
          TAG="docsumv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true

      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DocSummarizer.Core/Mostlylucid.DocSummarizer.Core.csproj \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet build src/Mostlylucid.DocSummarizer.Core/Mostlylucid.DocSummarizer.Core.csproj \
            -c Release -p:GeneratePackageOnBuild=false \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.Core/Mostlylucid.DocSummarizer.Core.csproj \
            -c Release -o ./artifacts --no-build \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}

      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: 'mostlylucid'

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        continue-on-error: true

      - uses: actions/upload-artifact@v6
        with:
          name: docsummarizer-pkg
          path: ./artifacts/*

  # ── Wait for DocSummarizer ─────────────────────────────────────────────
  wait-for-docsummarizer:
    needs: [publish-summarizer-core, publish-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/mostlylucid.lucidrag.docsummarizer/${VERSION}/mostlylucid.lucidrag.docsummarizer.${VERSION}.nupkg")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Timeout — continuing anyway"

  # ── Tier 2: Backend packages (parallel) ────────────────────────────────
  publish-rdbms-sqlite:
    needs: [publish-summarizer-core, wait-for-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="dssqlitev${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DocSummarizer.Rdbms.Sqlite/Mostlylucid.DocSummarizer.Rdbms.Sqlite.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.Rdbms.Sqlite/Mostlylucid.DocSummarizer.Rdbms.Sqlite.csproj \
            -c Release -o ./artifacts \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: rdbms-sqlite-pkg, path: './artifacts/*' }

  publish-fts-lucene:
    needs: [publish-summarizer-core, wait-for-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="dsftlucev${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DocSummarizer.FullText.Lucene/Mostlylucid.DocSummarizer.FullText.Lucene.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.FullText.Lucene/Mostlylucid.DocSummarizer.FullText.Lucene.csproj \
            -c Release -o ./artifacts \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: fts-lucene-pkg, path: './artifacts/*' }

  publish-fts-sqlite:
    needs: [publish-summarizer-core, wait-for-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="dsftsqlv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DocSummarizer.FullText.Sqlite/Mostlylucid.DocSummarizer.FullText.Sqlite.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.FullText.Sqlite/Mostlylucid.DocSummarizer.FullText.Sqlite.csproj \
            -c Release -o ./artifacts \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: fts-sqlite-pkg, path: './artifacts/*' }

  publish-docsummarizer-anthropic:
    needs: [publish-summarizer-core, wait-for-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="dsanthv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DocSummarizer.Anthropic/Mostlylucid.DocSummarizer.Anthropic.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.Anthropic/Mostlylucid.DocSummarizer.Anthropic.csproj \
            -c Release -o ./artifacts \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: docsummarizer-anthropic-pkg, path: './artifacts/*' }

  publish-docsummarizer-openai:
    needs: [publish-summarizer-core, wait-for-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="dsoaiv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DocSummarizer.OpenAI/Mostlylucid.DocSummarizer.OpenAI.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.OpenAI/Mostlylucid.DocSummarizer.OpenAI.csproj \
            -c Release -o ./artifacts \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: docsummarizer-openai-pkg, path: './artifacts/*' }

  # ── Wait for backends ──────────────────────────────────────────────────
  wait-for-backends:
    needs: [publish-summarizer-core, publish-rdbms-sqlite, publish-fts-lucene, publish-fts-sqlite, publish-docsummarizer-anthropic, publish-docsummarizer-openai]
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet for backend packages
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for pkg in mostlylucid.lucidrag.docsummarizer.rdbms.sqlite mostlylucid.lucidrag.docsummarizer.fulltext.lucene mostlylucid.lucidrag.docsummarizer.fulltext.sqlite mostlylucid.lucidrag.docsummarizer.anthropic mostlylucid.lucidrag.docsummarizer.openai; do
            echo "Waiting for $pkg ${VERSION}..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.nuget.org/v3-flatcontainer/$pkg/${VERSION}/$pkg.${VERSION}.nupkg")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 30
            done
          done

  # ── Tier 2.5: LLM + Decomposer (parallel, after backends) ─────────────
  publish-llm:
    needs: [publish-summarizer-core, wait-for-backends]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="llmv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/LucidRAG.LLM/LucidRAG.LLM.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet build src/LucidRAG.LLM/LucidRAG.LLM.csproj \
            -c Release -p:GeneratePackageOnBuild=false \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/LucidRAG.LLM/LucidRAG.LLM.csproj \
            -c Release -o ./artifacts --no-build \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: llm-pkg, path: './artifacts/*' }

  publish-decomposer:
    needs: [publish-summarizer-core, wait-for-backends]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}', dotnet-quality: '${{ env.DOTNET_QUALITY }}' }
      - name: Create version tag for MinVer
        run: |
          TAG="decomv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/LucidRAG.Decomposer/LucidRAG.Decomposer.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet build src/LucidRAG.Decomposer/LucidRAG.Decomposer.csproj \
            -c Release -p:GeneratePackageOnBuild=false \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/LucidRAG.Decomposer/LucidRAG.Decomposer.csproj \
            -c Release -o ./artifacts --no-build \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with: { name: decomposer-pkg, path: './artifacts/*' }

  wait-for-llm-decomposer:
    needs: [publish-summarizer-core, publish-llm, publish-decomposer]
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet for LLM + Decomposer
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for pkg in mostlylucid.lucidrag.llm mostlylucid.lucidrag.decomposer; do
            echo "Waiting for $pkg ${VERSION}..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.nuget.org/v3-flatcontainer/$pkg/${VERSION}/$pkg.${VERSION}.nupkg")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 30
            done
          done

  # ── Tier 3: DoomSummarizer.Core ────────────────────────────────────────
  publish-doomsummarizer:
    needs: [publish-summarizer-core, wait-for-backends, wait-for-llm-decomposer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Create version tag for MinVer
        run: |
          TAG="doomcorev${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true

      - name: Build & Pack
        run: |
          dotnet restore src/DoomSummarizer.Core/DoomSummarizer.Core.csproj \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet build src/DoomSummarizer.Core/DoomSummarizer.Core.csproj \
            -c Release -p:GeneratePackageOnBuild=false \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/DoomSummarizer.Core/DoomSummarizer.Core.csproj \
            -c Release -o ./artifacts --no-build \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}

      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: 'mostlylucid'

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        continue-on-error: true

      - uses: actions/upload-artifact@v6
        with:
          name: doomsummarizer-pkg
          path: ./artifacts/*

  # ── Wait for DoomSummarizer.Core ───────────────────────────────────────
  wait-for-doomsummarizer:
    needs: [publish-summarizer-core, publish-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/mostlylucid.lucidrag.doomsummarizer.core/${VERSION}/mostlylucid.lucidrag.doomsummarizer.core.${VERSION}.nupkg")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Timeout — continuing anyway"

  # ── Tier 4: Sources + Readers + Plugin (all parallel) ──────────────────
  publish-source-hackernews:
    needs: [publish-summarizer-core, wait-for-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
