    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DoomSummarizer.Plugin.Audio/Mostlylucid.DoomSummarizer.Plugin.Audio.csproj
          tag-prefix: plgaudiov
          artifact-name: plugin-audio
          version: ${{ github.event.inputs.version }}

  publish-plugin-data:
    needs: [publish-summarizer-core, wait-for-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DoomSummarizer.Plugin.Data/Mostlylucid.DoomSummarizer.Plugin.Data.csproj
          tag-prefix: plgdatav
          artifact-name: plugin-data
          version: ${{ github.event.inputs.version }}

  publish-plugin-image:
    needs: [publish-summarizer-core, wait-for-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DoomSummarizer.Plugin.Image/Mostlylucid.DoomSummarizer.Plugin.Image.csproj
          tag-prefix: plgimagev
          artifact-name: plugin-image
          version: ${{ github.event.inputs.version }}

  publish-plugin-video:
    needs: [publish-summarizer-core, wait-for-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DoomSummarizer.Plugin.Video/Mostlylucid.DoomSummarizer.Plugin.Video.csproj
          tag-prefix: plgvideov
          artifact-name: plugin-video
          version: ${{ github.event.inputs.version }}

  publish-plugin-subtitles:
    needs: [publish-summarizer-core, wait-for-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DoomSummarizer.Plugin.Subtitles/Mostlylucid.DoomSummarizer.Plugin.Subtitles.csproj
          tag-prefix: plgsubv
          artifact-name: plugin-subtitles
          version: ${{ github.event.inputs.version }}

  publish-codesummarizer-mermaid-jint:
    needs: [publish-summarizer-core, wait-for-doomsummarizer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/CodeSummarizer.Mermaid.Jint/CodeSummarizer.Mermaid.Jint.csproj
          tag-prefix: codemermaidv
          artifact-name: codesummarizer-mermaid-jint
          version: ${{ github.event.inputs.version }}
          publish-snupkg: 'true'

  # ── Wait for all Tier 4 plugins ─────────────────────────────────────
  wait-for-tier4-plugins:
    needs:
      - publish-summarizer-core
      - publish-plugin-books
      - publish-plugin-audio
      - publish-plugin-data
      - publish-plugin-image
      - publish-plugin-video
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet for plugins
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for pkg in mostlylucid.lucidrag.plugins.books mostlylucid.lucidrag.plugins.audio mostlylucid.lucidrag.plugins.data mostlylucid.lucidrag.plugins.image mostlylucid.lucidrag.plugins.video; do
            echo "Waiting for $pkg ${VERSION}..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.nuget.org/v3-flatcontainer/$pkg/${VERSION}/$pkg.${VERSION}.nupkg")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 30
            done
          done

  # ── Tier 4.5: Plugins.Complete (meta-package) ───────────────────────
  publish-plugins-complete:
    needs: [publish-summarizer-core, wait-for-tier4-plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.LucidRAG.Plugins.Complete/Mostlylucid.LucidRAG.Plugins.Complete.csproj
          tag-prefix: plgcompv
          artifact-name: plugins-complete
          version: ${{ github.event.inputs.version }}

  # ── Tier 5: Complete meta-package (fat CLI with everything) ────────────
  publish-doomsummarizer-complete:
    needs:
      - publish-summarizer-core
      - publish-codesummarizer
      - publish-storage-core
      - publish-datasummarizer-core
      - publish-imagesummarizer
      - publish-audiosummarizer
      - publish-videosummarizer
      - publish-source-hackernews
      - publish-source-reddit
      - publish-source-google
      - publish-source-news
      - publish-source-web
      - publish-source-academic
      - publish-source-science
      - publish-source-reference
      - publish-source-ukgov
      - publish-source-youtube
      - publish-reader-pdf
      - publish-reader-docx
      - publish-reader-gutenberg
      - publish-reader-markdown
      - publish-reader-docling
      - publish-plugin-books
      - publish-plugin-audio
      - publish-plugin-data
      - publish-plugin-image
      - publish-plugin-video
      - publish-plugin-subtitles
      - publish-plugins-complete
      - publish-codesummarizer-mermaid-jint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DoomSummarizer.Complete/Mostlylucid.DoomSummarizer.Complete.csproj
          tag-prefix: doomcompv
          artifact-name: doomsummarizer-complete
          version: ${{ github.event.inputs.version }}
          use-nuget-dep: 'false'
          publish-github: 'true'
          github-token: ${{ github.token }}

  # ── Summary ────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs:
      - publish-summarizer-core
      - publish-codesummarizer
      - publish-storage-core
      - publish-datasummarizer-core
      - publish-docsummarizer
      - publish-rdbms-sqlite
      - publish-fts-lucene
      - publish-fts-sqlite
      - publish-docsummarizer-anthropic
      - publish-docsummarizer-openai
      - publish-llm
      - publish-decomposer
      - publish-imagesummarizer
      - publish-audiosummarizer
      - publish-videosummarizer
      - publish-doomsummarizer
      - publish-ultraresearch
      - publish-codesummarizer-mermaid-jint
      - publish-source-hackernews
      - publish-source-reddit
      - publish-source-google
      - publish-source-news
      - publish-source-web
      - publish-source-academic
      - publish-source-science
      - publish-source-reference
      - publish-source-ukgov
      - publish-source-youtube
      - publish-reader-pdf
      - publish-reader-docx
      - publish-reader-gutenberg
      - publish-reader-markdown
      - publish-reader-docling
      - publish-plugin-books
      - publish-plugin-audio
      - publish-plugin-data
      - publish-plugin-image
      - publish-plugin-video
      - publish-plugin-subtitles
      - publish-plugins-complete
      - publish-doomsummarizer-complete
    if: always()
    steps:
      - name: Summary
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          echo "## Cascading NuGet Publish — v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | \`Mostlylucid.LucidRAG.Summarizer.Core\` | ${{ needs.publish-summarizer-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0.5 | \`Mostlylucid.LucidRAG.CodeSummarizer\` | ${{ needs.publish-codesummarizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0.5 | \`Mostlylucid.LucidRAG.Storage.Core\` | ${{ needs.publish-storage-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0.5 | \`Mostlylucid.LucidRAG.DataSummarizer\` | ${{ needs.publish-datasummarizer-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | \`Mostlylucid.LucidRAG.DocSummarizer\` | ${{ needs.publish-docsummarizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | \`Mostlylucid.LucidRAG.DocSummarizer.Rdbms.Sqlite\` | ${{ needs.publish-rdbms-sqlite.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | \`Mostlylucid.LucidRAG.DocSummarizer.FullText.Lucene\` | ${{ needs.publish-fts-lucene.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | \`Mostlylucid.LucidRAG.DocSummarizer.FullText.Sqlite\` | ${{ needs.publish-fts-sqlite.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | \`Mostlylucid.LucidRAG.DocSummarizer.Anthropic\` | ${{ needs.publish-docsummarizer-anthropic.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | \`Mostlylucid.LucidRAG.DocSummarizer.OpenAI\` | ${{ needs.publish-docsummarizer-openai.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2.5 | \`Mostlylucid.LucidRAG.LLM\` | ${{ needs.publish-llm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2.5 | \`Mostlylucid.LucidRAG.Decomposer\` | ${{ needs.publish-decomposer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2.5 | \`Mostlylucid.LucidRAG.ImageSummarizer\` | ${{ needs.publish-imagesummarizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2.5 | \`Mostlylucid.LucidRAG.AudioSummarizer\` | ${{ needs.publish-audiosummarizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2.5 | \`Mostlylucid.LucidRAG.VideoSummarizer\` | ${{ needs.publish-videosummarizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | \`Mostlylucid.LucidRAG.DoomSummarizer.Core\` | ${{ needs.publish-doomsummarizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3.5 | \`Mostlylucid.LucidRAG.UltraResearch\` | ${{ needs.publish-ultraresearch.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.HackerNews\` | ${{ needs.publish-source-hackernews.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.Reddit\` | ${{ needs.publish-source-reddit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.Google\` | ${{ needs.publish-source-google.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.News\` | ${{ needs.publish-source-news.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.Web\` | ${{ needs.publish-source-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.Academic\` | ${{ needs.publish-source-academic.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.Science\` | ${{ needs.publish-source-science.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.Reference\` | ${{ needs.publish-source-reference.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Readers.Pdf\` | ${{ needs.publish-reader-pdf.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Readers.Docx\` | ${{ needs.publish-reader-docx.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Readers.Gutenberg\` | ${{ needs.publish-reader-gutenberg.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Readers.Markdown\` | ${{ needs.publish-reader-markdown.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Readers.Docling\` | ${{ needs.publish-reader-docling.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | \`Mostlylucid.LucidRAG.Sources.UkGov\` | ${{ needs.publish-source-ukgov.result }} |" >> $GITHUB_STEP_SUMMARY
