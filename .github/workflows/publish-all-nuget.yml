name: Publish All NuGet Packages

# Cascading publish of ALL NuGet packages:
# 0.   Summarizer.Core (pure interfaces) -> wait
# 0.5  CodeSummarizer, Storage.Core, DataSummarizer.Core (parallel) -> wait
# 1.   DocSummarizer (interfaces + services) -> wait
# 2.   Backends (Rdbms.Sqlite, FullText.Lucene, FullText.Sqlite, Anthropic, OpenAI) parallel -> wait
# 2.5  LLM, Decomposer, ImageSummarizer, AudioSummarizer (parallel) -> wait
# 2.5c VideoSummarizer (needs Image + Audio) -> wait
# 3.   DoomSummarizer.Core -> wait
# 3.5  UltraResearch (needs DoomSummarizer.Core)
# 4.   Sources + Readers + Plugins (all parallel) -> wait
# 4.5  Plugins.Complete (meta-package)
# 5.   DoomSummarizer.Complete (meta-package: fat CLI with everything)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for ALL packages (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  # ── Tier 0: Summarizer.Core (pure interfaces) ──────────────────────────
  publish-summarizer-core:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.Summarizer.Core/Mostlylucid.Summarizer.Core.csproj
          tag-prefix: sumcorev
          artifact-name: summarizer-core
          version: ${{ github.event.inputs.version }}
          use-nuget-dep: 'false'
          publish-github: 'true'
          publish-snupkg: 'true'
          github-token: ${{ github.token }}

  # ── Wait for Summarizer.Core on NuGet ──────────────────────────────────
  wait-for-summarizer-core:
    needs: publish-summarizer-core
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/mostlylucid.lucidrag.summarizer.core/${VERSION}/mostlylucid.lucidrag.summarizer.core.${VERSION}.nupkg")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Timeout — continuing anyway"

  # ── Tier 0.5: CodeSummarizer, Storage.Core, DataSummarizer.Core ────────
  publish-codesummarizer:
    needs: wait-for-summarizer-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/CodeSummarizer.Core/CodeSummarizer.Core.csproj
          tag-prefix: codesumv
          artifact-name: codesummarizer
          version: ${{ github.event.inputs.version }}

  publish-storage-core:
    needs: wait-for-summarizer-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.Storage.Core/Mostlylucid.Storage.Core.csproj
          tag-prefix: storagev
          artifact-name: storage-core
          version: ${{ github.event.inputs.version }}

  publish-datasummarizer-core:
    needs: wait-for-summarizer-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/DataSummarizer.Core/DataSummarizer.Core.csproj
          tag-prefix: datasumv
          artifact-name: datasummarizer-core
          version: ${{ github.event.inputs.version }}

  # ── Wait for Tier 0.5 ─────────────────────────────────────────────────
  wait-for-tier05:
    needs:
      - publish-summarizer-core
      - publish-codesummarizer
      - publish-storage-core
      - publish-datasummarizer-core
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet for Tier 0.5
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for pkg in mostlylucid.lucidrag.codesummarizer mostlylucid.lucidrag.storage.core mostlylucid.lucidrag.datasummarizer; do
            echo "Waiting for $pkg ${VERSION}..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.nuget.org/v3-flatcontainer/$pkg/${VERSION}/$pkg.${VERSION}.nupkg")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 30
            done
          done

  # ── Tier 1: DocSummarizer ─────────────────────────────────────────────
  publish-docsummarizer:
    needs: wait-for-tier05
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DocSummarizer.Core/Mostlylucid.DocSummarizer.Core.csproj
          tag-prefix: docsumv
          artifact-name: docsummarizer
          version: ${{ github.event.inputs.version }}

  # ── Wait for DocSummarizer ────────────────────────────────────────────
  wait-for-docsummarizer:
    needs: [publish-summarizer-core, publish-docsummarizer]
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/mostlylucid.lucidrag.docsummarizer/${VERSION}/mostlylucid.lucidrag.docsummarizer.${VERSION}.nupkg")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Timeout — continuing anyway"

  # ── Tier 2: Backends (parallel) ───────────────────────────────────────
  publish-rdbms-sqlite:
    needs: wait-for-docsummarizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DocSummarizer.Rdbms.Sqlite/Mostlylucid.DocSummarizer.Rdbms.Sqlite.csproj
          tag-prefix: rdbmssqlitev
          artifact-name: rdbms-sqlite
          version: ${{ github.event.inputs.version }}

  publish-fts-lucene:
    needs: wait-for-docsummarizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DocSummarizer.FullText.Lucene/Mostlylucid.DocSummarizer.FullText.Lucene.csproj
          tag-prefix: ftslucenev
          artifact-name: fts-lucene
          version: ${{ github.event.inputs.version }}

  publish-fts-sqlite:
    needs: wait-for-docsummarizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DocSummarizer.FullText.Sqlite/Mostlylucid.DocSummarizer.FullText.Sqlite.csproj
          tag-prefix: ftssqlitev
          artifact-name: fts-sqlite
          version: ${{ github.event.inputs.version }}

  publish-docsummarizer-anthropic:
    needs: wait-for-docsummarizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DocSummarizer.Anthropic/Mostlylucid.DocSummarizer.Anthropic.csproj
          tag-prefix: docsumanthv
          artifact-name: docsummarizer-anthropic
          version: ${{ github.event.inputs.version }}

  publish-docsummarizer-openai:
    needs: wait-for-docsummarizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/nuget-pack-publish
        with:
          project-path: src/Mostlylucid.DocSummarizer.OpenAI/Mostlylucid.DocSummarizer.OpenAI.csproj
          tag-prefix: docsumoaiv
          artifact-name: docsummarizer-openai
          version: ${{ github.event.inputs.version }}

  # ── Wait for Backends ─────────────────────────────────────────────────
  wait-for-backends:
    needs:
      - publish-summarizer-core
      - publish-rdbms-sqlite
      - publish-fts-lucene
      - publish-fts-sqlite
      - publish-docsummarizer-anthropic
      - publish-docsummarizer-openai
    runs-on: ubuntu-latest
    steps:
      - name: Poll NuGet for backends
        run: |
          VERSION="${{ needs.publish-summarizer-core.outputs.version }}"
          for pkg in mostlylucid.lucidrag.docsummarizer.rdbms.sqlite mostlylucid.lucidrag.docsummarizer.fulltext.lucene mostlylucid.lucidrag.docsummarizer.fulltext.sqlite mostlylucid.lucidrag.docsummarizer.anthropic mostlylucid.lucidrag.docsummarizer.openai; do
            echo "Waiting for $pkg ${VERSION}..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.nuget.org/v3-flatcontainer/$pkg/${VERSION}/$pkg.${VERSION}.nupkg")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 30
            done
          done

  # ── Tier 2.5: LLM, Decomposer, Image, Audio (parallel) ──────────────
  publish-llm:
