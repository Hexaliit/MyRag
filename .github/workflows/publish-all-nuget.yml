            -p:MinVerVersionOverride=${{ inputs.version }}
          dotnet pack src/Mostlylucid.DocSummarizer.Rdbms.Sqlite/Mostlylucid.DocSummarizer.Rdbms.Sqlite.csproj \
            -c Release --no-build --output ./artifacts \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ inputs.version }} \
            -p:MinVerVersionOverride=${{ inputs.version }}

      - name: Login to NuGet (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: 'mostlylucid'

      - name: Publish
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
