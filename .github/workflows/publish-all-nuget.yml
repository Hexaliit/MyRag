      - name: Create version tag for MinVer
        run: |
          TAG="srchnv${{ needs.publish-summarizer-core.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
      - name: Build & Pack
        run: |
          dotnet restore src/Mostlylucid.DoomSummarizer.Source.HackerNews/Mostlylucid.DoomSummarizer.Source.HackerNews.csproj \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
          dotnet pack src/Mostlylucid.DoomSummarizer.Source.HackerNews/Mostlylucid.DoomSummarizer.Source.HackerNews.csproj \
            -c Release -o ./artifacts \
            -p:UseNuGetDependency=true -p:CorePackageVersion=${{ needs.publish-summarizer-core.outputs.version }}
      - name: NuGet Login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with: { user: 'mostlylucid' }
      - name: Publish
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
