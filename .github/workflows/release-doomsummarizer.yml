name: Unleash DoomSummarizer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.0.1)'
        required: true
        default: '0.0.1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build and test
        run: |
          dotnet build src/DoomSummarizer/DoomSummarizer.csproj -c Release
          dotnet test src/DoomSummarizer.Tests/DoomSummarizer.Tests.csproj \
            -c Release \
            --filter "Category!=Network%26Category!=Smoke%26Category!=RequiresModel" \
            --logger "console;verbosity=normal"

  build:
    needs: test
    strategy:
      matrix:
        build_type: [slim, complete]
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: win-arm64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: linux-arm64
            os: ubuntu-latest
            ext: ''
          - rid: osx-x64
            os: macos-latest
            ext: ''
          - rid: osx-arm64
            os: macos-latest
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish single-file
        shell: bash
        run: |
          dotnet publish src/DoomSummarizer/DoomSummarizer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:IncludeNativeLibrariesForSelfExtract=${{ startsWith(matrix.rid, 'osx') && 'false' || 'true' }} \
            -p:CompleteBuild=${{ matrix.build_type == 'complete' && 'true' || 'false' }} \
            -p:Version=${{ github.event.inputs.version }} \
            -o ./publish/${{ matrix.rid }}

      - name: Stage archive contents
        shell: bash
        run: |
          mkdir -p ./stage
          cp ./publish/${{ matrix.rid }}/doomsummarizer${{ matrix.ext }} ./stage/
          # On macOS, native libs sit alongside the binary (not embedded) to avoid Gatekeeper issues
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            cp ./publish/${{ matrix.rid }}/*.dylib ./stage/ 2>/dev/null || true
          fi
          cp src/DoomSummarizer/README.md ./stage/
          cp src/DoomSummarizer/Resources/default-config.json ./stage/config.json

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $variant = "${{ matrix.build_type }}" -eq "complete" ? "-complete" : ""
          Compress-Archive -Path ./stage/* -DestinationPath "./publish/doomsummarizer${variant}-${{ matrix.rid }}.zip"

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          variant=""
          if [[ "${{ matrix.build_type }}" == "complete" ]]; then variant="-complete"; fi
          cd ./stage
          tar -czvf "../publish/doomsummarizer${variant}-${{ matrix.rid }}.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: doomsummarizer${{ matrix.build_type == 'complete' && '-complete' || '' }}-${{ matrix.rid }}
          path: ./publish/doomsummarizer${{ matrix.build_type == 'complete' && '-complete' || '' }}-${{ matrix.rid }}.*
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doomsummarizer-v${{ github.event.inputs.version }}
          name: DoomSummarizer v${{ github.event.inputs.version }}
          body: |
            ## DoomSummarizer v${{ github.event.inputs.version }}

            **Reduced GraphRAG in a single binary.** DoomSummarizer is a distillation of [**LucidRAG**](https://github.com/scottgal/lucidrag) principles -- hybrid search, entity extraction, knowledge graph construction, evidence-grounded synthesis -- compressed into a self-contained CLI that runs from a single file. No server, no database setup, no API keys required to start.

            > **[Full documentation, all CLI options, and examples](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/README.md)**

            ### Downloads

            Two variants are available for each platform:

            | Variant | Description |
            |---------|-------------|
            | `doomsummarizer-{platform}` | **Slim** (~100MB) — Web crawling, KB Q&A, embeddings, NER, LLM routing |
            | `doomsummarizer-complete-{platform}` | **Complete** (~300MB) — Everything above + YouTube transcription, audio analysis, subtitle processing |

            ### What it does

            - **Fetches** from 50+ sources (HN, Reddit, RSS, arXiv, search APIs, any URL) in parallel
            - **Embeds** everything locally with ONNX (all-MiniLM-L6-v2, 384-dim) -- no API calls
            - **Ranks** with multi-signal RRF fusion: BM25 + freshness + authority + semantic similarity + vibe alignment
            - **Builds a graph** -- BERT NER entity extraction, knowledge graph construction, in-corpus PageRank for authority
            - **Crawls** websites with HTTP ETag/Last-Modified cache validation -- incremental re-crawls skip unchanged pages
            - **Follows links** one hop deep for content enrichment, applies TextRank sentence extraction
            - **Persists** everything in SQLite + DuckDB HNSW vectors -- your knowledge base grows with every query
            - **Synthesizes** evidence-grounded answers via LLM (local Ollama or cloud Anthropic/OpenAI)
            - **Generates** long-form articles with a 6-phase evidence-grounded pipeline and output validation

            All of this from a single file. Download, extract, run.

            ### Quick Start

            ```bash
            # 1. Extract and run setup (downloads embedding model, ~23MB one-time)
            doomsummarizer setup

            # 2. Doom scroll -- fetches, ranks, embeds, and summarizes
            doomsummarizer scroll

            # 3. Ask questions over your growing knowledge base
            doomsummarizer ask "What happened with the SSH vulnerability?"

            # 4. Crawl any site into a named knowledge base (incremental by default)
            doomsummarizer crawl https://docs.example.com --name docs --entities
            doomsummarizer ask --source crawl:docs "how does auth work?"

            # Topic-focused with personality
            doomsummarizer scroll "AI security news" --vibe snarky

            # Long-form article generation
            doomsummarizer scroll "history of LLMs" -t blog-article -o llm-history.md
            ```

            ### What's in the archive

            | File | Purpose |
            |------|---------|
            | `doomsummarizer` | Self-contained single-file binary (no .NET runtime needed) |
            | `README.md` | Full documentation -- all commands, flags, sources, pipeline details |
            | `config.json` | Default config reference (copy to `~/.doomsummarizer/config.json` to customize) |

            ### Works offline, scales up with APIs

            Out of the box, DoomSummarizer uses only free sources (RSS, HTML scraping, DuckDuckGo) and local models (ONNX embeddings, Ollama LLM). Optionally configure cloud search APIs (Brave, Serper, Tavily, NewsAPI) and cloud LLMs (Anthropic Claude, OpenAI GPT-4o) with built-in budget enforcement to stay within free tiers.

            Install [Ollama](https://ollama.com) for LLM synthesis, or use `--nollm` for the full ranking pipeline without it.

            ### Documentation

            - **[Full README with all commands, options, and examples](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/README.md)**
            - **[CLI reference](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/CLI.md)**
            - **[Knowledge base guide](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/KnowledgeBase.md)**
            - **[Source syntax](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/Sources.md)**
            - **[Templates](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/Templates.md)**

            ### Platforms
            - Windows x64, ARM64
            - Linux x64, ARM64
            - macOS x64 (Intel), ARM64 (Apple Silicon)
          draft: false
          prerelease: false
          files: |
            ./artifacts/doomsummarizer-win-x64/*.zip
            ./artifacts/doomsummarizer-complete-win-x64/*.zip
            ./artifacts/doomsummarizer-win-arm64/*.zip
            ./artifacts/doomsummarizer-complete-win-arm64/*.zip
            ./artifacts/doomsummarizer-linux-x64/*.tar.gz
            ./artifacts/doomsummarizer-complete-linux-x64/*.tar.gz
            ./artifacts/doomsummarizer-linux-arm64/*.tar.gz
            ./artifacts/doomsummarizer-complete-linux-arm64/*.tar.gz
            ./artifacts/doomsummarizer-osx-x64/*.tar.gz
            ./artifacts/doomsummarizer-complete-osx-x64/*.tar.gz
            ./artifacts/doomsummarizer-osx-arm64/*.tar.gz
            ./artifacts/doomsummarizer-complete-osx-arm64/*.tar.gz
