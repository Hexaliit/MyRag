# Manual corpus manifest — seed URL for documentation crawl.
# The crawler starts at seed_url and follows markdown links to discover docs.
# Other projects can ship their own manifest with a different seed_url.
name: doomsummarizer-manual
version: "2.0"
description: "DoomSummarizer built-in documentation"

# GitHub repo URL — crawler auto-detects GitHub and enables raw markdown mode.
# Starts at the README and follows links to discover all docs.
seed_url: "https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/README.md"

# Optional: restrict crawl to paths matching this glob (null = follow all links)
# path_filter: /scottgal/lucidrag/src/DoomSummarizer/**

# Crawl limits
max_depth: 3
max_pages: 50
