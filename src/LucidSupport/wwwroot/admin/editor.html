<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Editor &mdash; LucidSupport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script src="/admin/js/admin.js"></script>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-1 gap-2">
      <a href="/admin/index.html" class="btn btn-ghost text-xl">LucidSupport Admin</a>
      <span class="text-base-content/40">/</span>
      <span class="font-semibold" x-data x-text="$store.editor?.page?.title || 'Editor'"></span>
    </div>
    <div class="flex-none gap-2">
      <a href="/admin/index.html" class="btn btn-ghost btn-sm">Dashboard</a>
    </div>
  </div>

  <!-- Editor -->
  <div class="container mx-auto p-6" x-data="editor()">

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Error -->
    <div x-show="error" class="alert alert-error mb-4">
      <span x-text="error"></span>
    </div>

    <div x-show="!loading && page" x-cloak>
      <!-- Tabs -->
      <div role="tablist" class="tabs tabs-bordered mb-6">
        <a role="tab" class="tab" :class="{ 'tab-active': tab === 'fields' }" @click="tab = 'fields'">
          Fields <span class="badge badge-sm ml-1" x-text="page.fields.length"></span>
        </a>
        <a role="tab" class="tab" :class="{ 'tab-active': tab === 'conditions' }" @click="tab = 'conditions'">
          Conditions <span class="badge badge-sm ml-1" x-text="page.conditions.length"></span>
        </a>
        <a role="tab" class="tab" :class="{ 'tab-active': tab === 'topics' }" @click="tab = 'topics'">
          Topics <span class="badge badge-sm ml-1" x-text="page.topics.length"></span>
        </a>
        <a role="tab" class="tab" :class="{ 'tab-active': tab === 'workflow' }" @click="tab = 'workflow'">
          Workflow
          <span class="badge badge-sm ml-1" x-text="(page.sections?.length || 0) + (page.workflowRules?.length || 0)"></span>
        </a>
        <a role="tab" class="tab" :class="{ 'tab-active': tab === 'metadata' }" @click="tab = 'metadata'">
          Metadata
        </a>
      </div>

      <!-- Tab: Fields -->
      <div x-show="tab === 'fields'">
        <div class="overflow-x-auto">
          <table class="table table-sm">
            <thead>
              <tr>
                <th class="w-8"></th>
                <th>Selector</th>
                <th>Label</th>
                <th>Type</th>
                <th>Pattern</th>
                <th>Required</th>
                <th>Help</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(field, i) in page.fields" :key="field.selector">
                <tr class="hover cursor-pointer" @click="expandedField = expandedField === i ? -1 : i">
                  <td class="drag-handle" title="Drag to reorder">&#9776;</td>
                  <td><code class="text-xs" x-text="field.selector"></code></td>
                  <td x-text="field.label"></td>
                  <td><span class="badge badge-ghost badge-sm" x-text="field.type || 'text'"></span></td>
                  <td><span class="text-xs" x-text="field.pattern || '—'"></span></td>
                  <td>
                    <input type="checkbox" class="checkbox checkbox-xs" :checked="field.required"
                      @click.stop="field.required = !field.required; dirty = true">
                  </td>
                  <td class="max-w-xs truncate text-xs" x-text="field.help || '—'"></td>
                  <td>
                    <button class="btn btn-ghost btn-xs text-error" @click.stop="removeField(i)" title="Remove">&#10005;</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Expanded field detail -->
        <template x-if="expandedField >= 0 && page.fields[expandedField]">
          <div class="card bg-base-100 shadow-sm mt-4 p-4">
            <h3 class="font-semibold mb-3" x-text="'Edit: ' + page.fields[expandedField].label"></h3>
            <div class="grid grid-cols-2 gap-4">
              <div class="form-control">
                <label class="label"><span class="label-text">Selector</span></label>
                <input type="text" class="input input-bordered input-sm"
                  x-model="page.fields[expandedField].selector" @input="dirty = true">
              </div>
              <div class="form-control">
                <label class="label"><span class="label-text">Label</span></label>
                <input type="text" class="input input-bordered input-sm"
                  x-model="page.fields[expandedField].label" @input="dirty = true">
              </div>
              <div class="form-control">
                <label class="label"><span class="label-text">Type</span></label>
                <select class="select select-bordered select-sm" x-model="page.fields[expandedField].type" @change="dirty = true">
                  <option value="text">text</option>
                  <option value="email">email</option>
                  <option value="tel">tel</option>
                  <option value="password">password</option>
                  <option value="number">number</option>
                  <option value="url">url</option>
                  <option value="select">select</option>
                  <option value="textarea">textarea</option>
                </select>
              </div>
              <div class="form-control">
                <label class="label"><span class="label-text">Pattern</span></label>
                <input type="text" class="input input-bordered input-sm"
                  x-model="page.fields[expandedField].pattern" @input="dirty = true"
                  placeholder="email, phone, credit-card...">
              </div>
              <div class="form-control">
                <label class="label"><span class="label-text">Placeholder</span></label>
                <input type="text" class="input input-bordered input-sm"
                  x-model="page.fields[expandedField].placeholder" @input="dirty = true">
              </div>
              <div class="form-control">
                <label class="label"><span class="label-text">Autocomplete</span></label>
                <input type="text" class="input input-bordered input-sm"
                  x-model="page.fields[expandedField].autocomplete" @input="dirty = true">
              </div>
              <div class="form-control col-span-2">
                <label class="label"><span class="label-text">Help text</span></label>
                <textarea class="textarea textarea-bordered textarea-sm"
                  x-model="page.fields[expandedField].help" @input="dirty = true" rows="2"></textarea>
              </div>
            </div>

            <!-- Errors -->
            <div class="mt-3">
              <h4 class="text-sm font-semibold mb-2">Error messages</h4>
              <template x-for="(msg, key) in page.fields[expandedField].errors || {}" :key="key">
                <div class="flex gap-2 mb-1 items-center">
                  <span class="badge badge-ghost badge-sm" x-text="key"></span>
                  <input type="text" class="input input-bordered input-xs flex-1"
                    :value="msg" @input="page.fields[expandedField].errors[key] = $event.target.value; dirty = true">
                </div>
              </template>
            </div>
          </div>
        </template>

        <button class="btn btn-outline btn-sm mt-4" @click="addField()">+ Add Field</button>
      </div>

      <!-- Tab: Conditions -->
      <div x-show="tab === 'conditions'">
        <div class="space-y-3">
          <template x-for="(cond, i) in page.conditions" :key="i">
            <div class="card bg-base-100 shadow-sm condition-card border-l-4"
              :class="'type-' + getConditionType(cond.when)">
              <div class="card-body p-4">
                <div class="flex items-start justify-between">
                  <div class="flex-1">
                    <div class="text-sm mb-1">
                      <span class="font-semibold">When:</span>
                      <span class="font-mono text-xs" x-html="formatCondition(cond.when)"></span>
                    </div>
                    <div class="text-sm mb-1">
                      <span class="font-semibold">Suggest:</span>
                      <input type="text" class="input input-ghost input-xs w-full"
                        x-model="cond.suggest" @input="dirty = true">
                    </div>
                    <template x-if="cond.highlight">
                      <div class="text-sm">
                        <span class="font-semibold">Highlight:</span>
                        <code class="text-xs" x-text="cond.highlight"></code>
                      </div>
                    </template>
                  </div>
                  <button class="btn btn-ghost btn-xs text-error" @click="removeCondition(i)">&#10005;</button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Add condition form -->
        <div class="card bg-base-100 shadow-sm mt-4 p-4">
          <h3 class="font-semibold mb-3">Add Condition</h3>
          <div class="grid grid-cols-1 gap-3">
            <div class="form-control">
              <label class="label"><span class="label-text">When expression</span></label>
              <input type="text" class="input input-bordered input-sm" x-model="newCondition.when"
                placeholder="[#email].error AND user.attempts > 1">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Suggest text</span></label>
              <input type="text" class="input input-bordered input-sm" x-model="newCondition.suggest"
                placeholder="Help text to show...">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Highlight selector (optional)</span></label>
              <input type="text" class="input input-bordered input-sm" x-model="newCondition.highlight"
                placeholder="#email">
            </div>
            <button class="btn btn-primary btn-sm w-fit" @click="addCondition()"
              :disabled="!newCondition.when || !newCondition.suggest">Add</button>
          </div>
        </div>
      </div>

      <!-- Tab: Topics -->
      <div x-show="tab === 'topics'">
        <div class="space-y-2">
          <template x-for="(topic, i) in page.topics" :key="i">
            <div class="flex gap-2 items-center">
              <input type="text" class="input input-bordered input-sm flex-1"
                x-model="topic.question" @input="dirty = true" placeholder="Question...">
              <span class="text-base-content/40">&#8594;</span>
              <input type="text" class="input input-bordered input-sm w-48"
                x-model="topic.articleId" @input="dirty = true" placeholder="article-id">
              <button class="btn btn-ghost btn-xs text-error" @click="removeTopic(i)">&#10005;</button>
            </div>
          </template>
        </div>
        <button class="btn btn-outline btn-sm mt-4" @click="addTopic()">+ Add Topic</button>
      </div>

      <!-- Tab: Workflow -->
      <div x-show="tab === 'workflow'">
        <!-- Sections -->
        <h3 class="font-semibold mb-3">Sections</h3>
        <div class="space-y-3 mb-6">
          <template x-for="(section, i) in (page.sections || [])" :key="section.id">
            <div class="card bg-base-100 shadow-sm p-4">
              <div class="flex items-start justify-between">
                <div class="flex-1 grid grid-cols-3 gap-3">
                  <div class="form-control">
                    <label class="label"><span class="label-text text-xs">ID</span></label>
                    <input type="text" class="input input-bordered input-xs"
                      x-model="section.id" @input="dirty = true">
                  </div>
                  <div class="form-control">
                    <label class="label"><span class="label-text text-xs">Label</span></label>
                    <input type="text" class="input input-bordered input-xs"
                      x-model="section.label" @input="dirty = true">
                  </div>
                  <div class="form-control">
                    <label class="label"><span class="label-text text-xs">Order</span></label>
                    <input type="number" class="input input-bordered input-xs w-20"
                      x-model.number="section.order" @input="dirty = true">
                  </div>
                  <div class="form-control col-span-3">
                    <label class="label"><span class="label-text text-xs">Fields (comma-separated selectors)</span></label>
                    <input type="text" class="input input-bordered input-xs"
                      :value="(section.fields || []).join(', ')"
                      @input="section.fields = $event.target.value.split(',').map(s => s.trim()).filter(Boolean); dirty = true">
                  </div>
                </div>
                <button class="btn btn-ghost btn-xs text-error ml-2" @click="removeSection(i)">&#10005;</button>
              </div>
            </div>
          </template>
          <button class="btn btn-outline btn-sm" @click="addSection()">+ Add Section</button>
        </div>

        <!-- Workflow Rules -->
        <h3 class="font-semibold mb-3">Visibility Rules</h3>
        <div class="space-y-3 mb-4">
          <template x-for="(rule, i) in (page.workflowRules || [])" :key="i">
            <div class="card bg-base-100 shadow-sm p-4">
              <div class="flex items-start justify-between">
                <div class="flex-1 grid grid-cols-4 gap-3">
                  <div class="form-control col-span-2">
                    <label class="label"><span class="label-text text-xs">When</span></label>
                    <input type="text" class="input input-bordered input-xs"
                      x-model="rule.when" @input="dirty = true">
                  </div>
                  <div class="form-control">
                    <label class="label"><span class="label-text text-xs">Action</span></label>
                    <select class="select select-bordered select-xs" x-model="rule.action" @change="dirty = true">
                      <option value="show">show</option>
                      <option value="hide">hide</option>
                    </select>
                  </div>
                  <div class="form-control">
                    <label class="label"><span class="label-text text-xs">Target</span></label>
                    <input type="text" class="input input-bordered input-xs"
                      x-model="rule.target" @input="dirty = true">
                  </div>
                </div>
                <button class="btn btn-ghost btn-xs text-error ml-2" @click="removeWorkflowRule(i)">&#10005;</button>
              </div>
            </div>
          </template>
          <button class="btn btn-outline btn-sm" @click="addWorkflowRule()">+ Add Rule</button>
        </div>
      </div>

      <!-- Tab: Metadata -->
      <div x-show="tab === 'metadata'">
        <div class="card bg-base-100 shadow-sm p-4">
          <div class="grid grid-cols-2 gap-4">
            <div class="form-control">
              <label class="label"><span class="label-text">Page ID</span></label>
              <input type="text" class="input input-bordered input-sm" :value="page.pageId" disabled>
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">URL Pattern</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="page.urlPattern" @input="dirty = true">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Title</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="page.title" @input="dirty = true">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Site</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="page.site" @input="dirty = true">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Flow</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="page.flow" @input="dirty = true" placeholder="e.g. checkout">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Step</span></label>
              <input type="number" class="input input-bordered input-sm"
                x-model.number="page.step" @input="dirty = true">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Previous (page_id)</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="page.prev" @input="dirty = true">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Next (page_id)</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="page.next" @input="dirty = true">
            </div>
            <div class="form-control col-span-2">
              <label class="label"><span class="label-text">Description</span></label>
              <textarea class="textarea textarea-bordered textarea-sm"
                x-model="page.description" @input="dirty = true" rows="3"></textarea>
            </div>
          </div>

          <!-- Escalation -->
          <div class="divider">Escalation</div>
          <div class="grid grid-cols-3 gap-4">
            <div class="form-control">
              <label class="label"><span class="label-text">Plugin</span></label>
              <select class="select select-bordered select-sm"
                x-model="escalation.plugin" @change="dirty = true">
                <option value="console">console</option>
                <option value="webhook">webhook</option>
              </select>
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Webhook URL</span></label>
              <input type="url" class="input input-bordered input-sm"
                x-model="escalation.url" @input="dirty = true"
                :disabled="escalation.plugin !== 'webhook'">
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Threshold</span></label>
              <input type="number" step="0.5" class="input input-bordered input-sm"
                x-model.number="escalation.threshold" @input="dirty = true">
            </div>
          </div>
        </div>
      </div>

      <!-- Save bar (sticky bottom) -->
      <div class="fixed bottom-0 left-0 right-0 bg-base-100 border-t p-3 flex items-center justify-between z-50"
        :class="{ 'border-warning': dirty }">
        <div class="flex items-center gap-3">
          <span class="dirty-indicator badge badge-warning gap-1" :class="{ 'is-dirty': dirty }">
            Unsaved changes
          </span>
        </div>
        <div class="flex gap-2">
          <a :href="$store.admin?.exportUrl(page.pageId) || '#'" target="_blank"
            class="btn btn-ghost btn-sm">Export .support.md</a>
          <button class="btn btn-ghost btn-sm" @click="discard()" :disabled="!dirty">Discard</button>
          <button class="btn btn-primary btn-sm" @click="save()" :disabled="!dirty || saving">
            <span x-show="saving" class="loading loading-spinner loading-xs"></span>
            Save
          </button>
        </div>
      </div>

      <!-- Spacer for fixed save bar -->
      <div class="h-20"></div>
    </div>
  </div>

  <script>
    function editor() {
      const params = new URLSearchParams(window.location.search);
      const pageId = params.get('page');

      return {
        page: null,
        loading: true,
        error: null,
        tab: 'fields',
        dirty: false,
        saving: false,
        expandedField: -1,
        newCondition: { when: '', suggest: '', highlight: '' },
        escalation: { plugin: 'console', url: '', threshold: 8.0 },

        async init() {
          if (!pageId) {
            this.error = 'No page ID specified. Use ?page=pageId';
            this.loading = false;
            return;
          }
          const res = await fetch(`/api/admin/pages/${encodeURIComponent(pageId)}`);
          if (!res.ok) {
            this.error = `Page '${pageId}' not found`;
            this.loading = false;
            return;
          }
          this.page = await res.json();
          if (!this.page.sections) this.page.sections = [];
          if (!this.page.workflowRules) this.page.workflowRules = [];
          this.escalation = this.page.escalation || { plugin: 'console', url: '', threshold: 8.0 };

          // Make store available for navbar
          Alpine.store('editor', { page: this.page });
          this.loading = false;
        },

        // Fields
        addField() {
          this.page.fields.push({
            selector: '#new-field',
            label: 'New Field',
            type: 'text',
            pattern: null,
            help: '',
            required: false,
            minLength: null,
            maxLength: null,
            placeholder: '',
            autocomplete: '',
            clientValidation: [],
            serverValidation: [],
            errors: {}
          });
          this.expandedField = this.page.fields.length - 1;
          this.dirty = true;
        },
        removeField(i) {
          this.page.fields.splice(i, 1);
          this.expandedField = -1;
          this.dirty = true;
        },

        // Conditions
        addCondition() {
          if (!this.newCondition.when || !this.newCondition.suggest) return;
          this.page.conditions.push({
            when: this.newCondition.when,
            suggest: this.newCondition.suggest,
            highlight: this.newCondition.highlight || null
          });
          this.newCondition = { when: '', suggest: '', highlight: '' };
          this.dirty = true;
        },
        removeCondition(i) {
          this.page.conditions.splice(i, 1);
          this.dirty = true;
        },

        // Topics
        addTopic() {
          this.page.topics.push({ question: '', articleId: '' });
          this.dirty = true;
        },
        removeTopic(i) {
          this.page.topics.splice(i, 1);
          this.dirty = true;
        },

        // Sections
        addSection() {
          this.page.sections.push({ id: 'new-section', label: 'New Section', fields: [], order: this.page.sections.length });
          this.dirty = true;
        },
        removeSection(i) {
          this.page.sections.splice(i, 1);
          this.dirty = true;
        },

        // Workflow rules
        addWorkflowRule() {
          this.page.workflowRules.push({ when: '', action: 'show', target: '', priority: 0 });
          this.dirty = true;
        },
        removeWorkflowRule(i) {
          this.page.workflowRules.splice(i, 1);
          this.dirty = true;
        },

        // Save / Discard
        async save() {
          this.saving = true;
          const payload = {
            title: this.page.title,
            urlPattern: this.page.urlPattern,
            description: this.page.description,
            site: this.page.site,
            flow: this.page.flow,
            step: this.page.step,
            prev: this.page.prev,
            next: this.page.next,
            fields: this.page.fields,
            sections: this.page.sections,
            conditions: this.page.conditions,
            topics: this.page.topics,
            workflowRules: this.page.workflowRules,
            escalation: this.escalation
          };
          const res = await fetch(`/api/admin/pages/${encodeURIComponent(pageId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            this.page = await res.json();
            if (!this.page.sections) this.page.sections = [];
            if (!this.page.workflowRules) this.page.workflowRules = [];
            this.escalation = this.page.escalation || { plugin: 'console', url: '', threshold: 8.0 };
            this.dirty = false;
          }
          this.saving = false;
        },
        async discard() {
          this.loading = true;
          const res = await fetch(`/api/admin/pages/${encodeURIComponent(pageId)}`);
          if (res.ok) {
            this.page = await res.json();
            if (!this.page.sections) this.page.sections = [];
            if (!this.page.workflowRules) this.page.workflowRules = [];
            this.escalation = this.page.escalation || { plugin: 'console', url: '', threshold: 8.0 };
          }
          this.dirty = false;
          this.expandedField = -1;
          this.loading = false;
        },

        // Helpers (reference from admin.js)
        getConditionType,
        formatCondition
      };
    }
  </script>
</body>
</html>
