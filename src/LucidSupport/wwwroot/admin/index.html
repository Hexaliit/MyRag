<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LucidSupport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script src="/admin/js/admin.js"></script>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-1">
      <a href="/admin/index.html" class="btn btn-ghost text-xl">LucidSupport Admin</a>
    </div>
    <div class="flex-none gap-2">
      <a href="/demo/contact.html" target="_blank" class="btn btn-ghost btn-sm">Demo Site</a>
    </div>
  </div>

  <!-- Main content -->
  <div class="container mx-auto p-6" x-data="dashboard()">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold">Pages</h1>
        <p class="text-base-content/60">Manage learned page models</p>
      </div>
      <div class="form-control">
        <input type="text" placeholder="Search pages..."
          class="input input-bordered input-sm w-64"
          x-model="search">
      </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Page cards -->
    <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-for="page in filteredPages" :key="page.pageId">
        <div class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow">
          <div class="card-body">
            <!-- Title + Flow badge -->
            <div class="flex items-start justify-between">
              <h2 class="card-title text-lg" x-text="page.title"></h2>
              <template x-if="page.flow">
                <div class="badge badge-outline badge-sm">
                  Step <span x-text="page.step"></span>
                </div>
              </template>
            </div>

            <!-- URL pattern -->
            <p class="text-sm text-base-content/60 font-mono" x-text="page.urlPattern"></p>
            <p class="text-xs text-base-content/40" x-text="'ID: ' + page.pageId"></p>

            <!-- Stats -->
            <div class="flex gap-2 mt-2 flex-wrap">
              <div class="badge badge-primary badge-outline gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span x-text="page.fieldCount + ' fields'"></span>
              </div>
              <div class="badge badge-secondary badge-outline gap-1">
                <span x-text="page.conditionCount + ' conditions'"></span>
              </div>
              <div class="badge badge-accent badge-outline gap-1">
                <span x-text="page.topicCount + ' topics'"></span>
              </div>
              <template x-if="page.sectionCount > 0">
                <div class="badge badge-info badge-outline gap-1">
                  <span x-text="page.sectionCount + ' sections'"></span>
                </div>
              </template>
              <template x-if="page.workflowRuleCount > 0">
                <div class="badge badge-warning badge-outline gap-1">
                  <span x-text="page.workflowRuleCount + ' rules'"></span>
                </div>
              </template>
            </div>

            <!-- Actions -->
            <div class="card-actions justify-end mt-4">
              <a :href="'/admin/editor.html?page=' + encodeURIComponent(page.pageId)"
                class="btn btn-primary btn-sm">Edit</a>
              <a :href="'/admin/simulator.html?page=' + encodeURIComponent(page.pageId)"
                class="btn btn-outline btn-sm">Simulate</a>
              <a :href="'/admin/preview.html?page=' + encodeURIComponent(page.pageId)"
                class="btn btn-outline btn-sm">Preview</a>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && filteredPages.length === 0" class="text-center py-12">
      <p class="text-base-content/60">No pages found.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer footer-center p-4 bg-base-100 text-base-content/60 mt-8">
    <p>LucidSupport Admin &mdash; <a href="/demo/contact.html" class="link">Demo</a></p>
  </footer>

  <script>
    function dashboard() {
      return {
        pages: [],
        search: '',
        loading: true,

        async init() {
          const res = await fetch('/api/admin/pages');
          this.pages = res.ok ? await res.json() : [];
          this.loading = false;
        },

        get filteredPages() {
          if (!this.search.trim()) return this.pages;
          const q = this.search.toLowerCase();
          return this.pages.filter(p =>
            p.title.toLowerCase().includes(q) ||
            p.pageId.toLowerCase().includes(q) ||
            p.urlPattern.toLowerCase().includes(q)
          );
        }
      };
    }
  </script>
</body>
</html>
