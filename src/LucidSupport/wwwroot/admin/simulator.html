<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulator &mdash; LucidSupport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script src="/admin/js/admin.js"></script>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-1 gap-2">
      <a href="/admin/index.html" class="btn btn-ghost text-xl">LucidSupport Admin</a>
      <span class="text-base-content/40">/</span>
      <span>Simulator</span>
    </div>
    <div class="flex-none gap-2">
      <a href="/admin/index.html" class="btn btn-ghost btn-sm">Dashboard</a>
    </div>
  </div>

  <div class="container mx-auto p-6" x-data="simulator()">

    <div x-show="loading" class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>

    <div x-show="!loading && page" x-cloak>

      <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-bold" x-text="'Simulate: ' + page.title"></h1>

        <!-- Presets -->
        <div class="flex gap-2">
          <select class="select select-bordered select-sm" @change="applyPreset($event.target.value)">
            <option value="">Preset...</option>
            <option value="happy">Happy path</option>
            <option value="errors">Validation errors</option>
            <option value="frustrated">Frustrated user</option>
            <option value="custom">Custom (clear)</option>
          </select>
          <button class="btn btn-ghost btn-sm" @click="resetState()">Reset</button>
          <button class="btn btn-primary btn-sm" @click="runSimulation()">Simulate</button>
        </div>
      </div>

      <div class="simulator-split">
        <!-- Left: State Controls -->
        <div class="card bg-base-100 shadow-sm">
          <div class="card-body">
            <h2 class="card-title text-sm">Field States</h2>

            <div class="space-y-3">
              <template x-for="field in page.fields" :key="field.selector">
                <div class="border rounded-lg p-3">
                  <div class="flex items-center justify-between mb-2">
                    <span class="font-medium text-sm" x-text="field.label"></span>
                    <code class="text-xs text-base-content/40" x-text="field.selector"></code>
                  </div>
                  <div class="flex gap-4 flex-wrap">
                    <label class="flex items-center gap-1 text-xs cursor-pointer">
                      <input type="checkbox" class="toggle toggle-xs toggle-success"
                        :checked="fieldStates[field.selector]?.hasValue"
                        @change="toggleField(field.selector, 'hasValue')">
                      Has value
                    </label>
                    <label class="flex items-center gap-1 text-xs cursor-pointer">
                      <input type="checkbox" class="toggle toggle-xs toggle-error"
                        :checked="fieldStates[field.selector]?.hasError"
                        @change="toggleField(field.selector, 'hasError')">
                      Has error
                    </label>
                    <label class="flex items-center gap-1 text-xs cursor-pointer">
                      <input type="checkbox" class="toggle toggle-xs toggle-info"
                        :checked="fieldStates[field.selector]?.hasFocus"
                        @change="setFocus(field.selector)">
                      Focus
                    </label>
                  </div>
                  <template x-if="fieldStates[field.selector]?.hasError">
                    <div class="mt-2">
                      <input type="text" class="input input-bordered input-xs w-full"
                        placeholder="Error text..."
                        :value="fieldStates[field.selector]?.errorText || ''"
                        @input="fieldStates[field.selector].errorText = $event.target.value">
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <div class="divider">Global</div>

            <div class="grid grid-cols-2 gap-4">
              <div class="form-control">
                <label class="label"><span class="label-text text-xs">Idle seconds</span></label>
                <input type="range" class="range range-sm" min="0" max="120"
                  x-model.number="idleSeconds">
                <span class="text-xs text-center" x-text="idleSeconds + 's'"></span>
              </div>
              <div class="form-control">
                <label class="label"><span class="label-text text-xs">Submit attempts</span></label>
                <input type="number" class="input input-bordered input-xs" min="0"
                  x-model.number="submitAttempts">
              </div>
            </div>

            <div class="form-control mt-3">
              <label class="label"><span class="label-text text-xs">Question (optional)</span></label>
              <input type="text" class="input input-bordered input-sm"
                x-model="question" placeholder="Ask a question...">
            </div>
          </div>
        </div>

        <!-- Right: Response Preview -->
        <div class="space-y-4">
          <div class="card bg-base-100 shadow-sm">
            <div class="card-body">
              <h2 class="card-title text-sm">Response Preview</h2>

              <div x-show="!result" class="text-base-content/40 text-sm py-8 text-center">
                Click "Simulate" to see the response
              </div>

              <template x-if="result">
                <div>
                  <!-- Response text -->
                  <div class="bg-base-200 rounded-lg p-4 mb-3">
                    <div class="prose prose-sm" x-html="formatMarkdown(result.response.text)"></div>
                  </div>

                  <!-- Highlights -->
                  <template x-if="result.response.highlights.length > 0">
                    <div class="mb-3">
                      <h4 class="text-xs font-semibold mb-1">Highlights</h4>
                      <div class="flex gap-1 flex-wrap">
                        <template x-for="h in result.response.highlights" :key="h.selector">
                          <span class="badge badge-sm" :class="{
                            'badge-error': h.style === 'error',
                            'badge-info': h.style === 'info',
                            'badge-success': h.style === 'success'
                          }" x-text="h.selector"></span>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Suggestions -->
                  <template x-if="result.response.suggestions.length > 0">
                    <div class="mb-3">
                      <h4 class="text-xs font-semibold mb-1">Suggestions</h4>
                      <div class="flex gap-1 flex-wrap">
                        <template x-for="s in result.response.suggestions" :key="s">
                          <span class="badge badge-outline badge-sm" x-text="s"></span>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Topics -->
                  <template x-if="result.response.topics.length > 0">
                    <div class="mb-3">
                      <h4 class="text-xs font-semibold mb-1">Topics</h4>
                      <div class="flex gap-1 flex-wrap">
                        <template x-for="t in result.response.topics" :key="t.id">
                          <span class="badge badge-accent badge-sm" x-text="t.label"></span>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>

          <!-- Debug output -->
          <template x-if="result">
            <div class="card bg-base-100 shadow-sm">
              <div class="card-body">
                <h2 class="card-title text-sm">Debug</h2>
                <div class="text-xs space-y-1">
                  <div><span class="font-semibold">Matched conditions:</span>
                    <span x-text="result.matchedConditions.length ? result.matchedConditions.join(', ') : 'none'"></span>
                  </div>
                  <div><span class="font-semibold">Source:</span>
                    <span x-text="result.response.source || '—'"></span>
                  </div>
                  <template x-for="d in result.debugInfo" :key="d">
                    <div class="text-base-content/60" x-text="d"></div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script>
    function simulator() {
      const params = new URLSearchParams(window.location.search);
      const pageId = params.get('page');

      return {
        page: null,
        loading: true,
        fieldStates: {},
        idleSeconds: 0,
        submitAttempts: 0,
        question: '',
        result: null,

        async init() {
          if (!pageId) { this.loading = false; return; }
          const res = await fetch(`/api/admin/pages/${encodeURIComponent(pageId)}`);
          if (res.ok) {
            this.page = await res.json();
            this.initFieldStates();
          }
          this.loading = false;
        },

        initFieldStates() {
          this.fieldStates = {};
          for (const f of this.page.fields) {
            this.fieldStates[f.selector] = {
              hasValue: false,
              hasError: false,
              errorText: null,
              hasFocus: false
            };
          }
        },

        toggleField(selector, prop) {
          if (!this.fieldStates[selector]) return;
          this.fieldStates[selector][prop] = !this.fieldStates[selector][prop];
        },

        setFocus(selector) {
          // Only one field can have focus
          for (const key of Object.keys(this.fieldStates)) {
            this.fieldStates[key].hasFocus = (key === selector) ? !this.fieldStates[key].hasFocus : false;
          }
        },

        resetState() {
          this.initFieldStates();
          this.idleSeconds = 0;
          this.submitAttempts = 0;
          this.question = '';
          this.result = null;
        },

        applyPreset(preset) {
          this.resetState();
          if (preset === 'happy') {
            for (const key of Object.keys(this.fieldStates)) {
              this.fieldStates[key].hasValue = true;
            }
          } else if (preset === 'errors') {
            for (const f of this.page.fields) {
              if (f.required) {
                this.fieldStates[f.selector].hasError = true;
                const firstErr = Object.values(f.errors || {})[0];
                if (firstErr) this.fieldStates[f.selector].errorText = firstErr;
              }
            }
            this.submitAttempts = 1;
          } else if (preset === 'frustrated') {
            for (const f of this.page.fields) {
              this.fieldStates[f.selector].hasError = true;
              this.fieldStates[f.selector].hasValue = true;
            }
            this.submitAttempts = 3;
            this.idleSeconds = 45;
          }
          this.runSimulation();
        },

        async runSimulation() {
          const payload = {
            fieldStates: this.fieldStates,
            idleSeconds: this.idleSeconds,
            submitAttempts: this.submitAttempts,
            question: this.question || null
          };
          const res = await fetch(`/api/admin/pages/${encodeURIComponent(pageId)}/simulate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            this.result = await res.json();
          }
        },

        formatMarkdown(text) {
          // Simple markdown formatting
          return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>')
            .replace(/^• /gm, '&bull; ');
        }
      };
    }
  </script>
</body>
</html>
