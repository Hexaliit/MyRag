<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Information — LucidSupport Demo</title>
  <link rel="stylesheet" href="/demo/styles.css">
</head>
<body>
  <div class="page">
    <nav class="nav">
      <span class="nav-logo">LucidSupport Demo</span>
      <span class="nav-step">Step 1 of 2</span>
    </nav>

    <form id="contact-form" class="card" novalidate>
      <h1 class="card-title">Contact Information</h1>
      <p class="card-desc">Tell us about yourself so we can reach you.</p>

      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="first-name" name="first-name"
                 required minlength="2" maxlength="50"
                 autocomplete="given-name"
                 placeholder="Jane"
                 aria-required="true"
                 aria-describedby="first-name-help"
                 aria-errormessage="first-name-error">
          <span class="help-text" id="first-name-help">Your legal first name</span>
          <span class="error-message" id="first-name-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="last-name">Last Name <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="last-name" name="last-name"
                 required minlength="2" maxlength="50"
                 autocomplete="family-name"
                 placeholder="Doe"
                 aria-required="true"
                 aria-describedby="last-name-help"
                 aria-errormessage="last-name-error">
          <span class="help-text" id="last-name-help">Your legal last name</span>
          <span class="error-message" id="last-name-error" role="alert"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required" aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email"
               required
               autocomplete="email"
               placeholder="jane@example.com"
               aria-required="true"
               aria-describedby="email-help"
               aria-errormessage="email-error">
        <span class="help-text" id="email-help">We'll use this for order confirmations</span>
        <span class="error-message" id="email-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               autocomplete="tel"
               placeholder="+1 (555) 123-4567"
               pattern="[\+]?[\d\s\-\(\)]{7,20}"
               aria-describedby="phone-help"
               aria-errormessage="phone-error">
        <span class="help-text" id="phone-help">Optional — for delivery updates only</span>
        <span class="error-message" id="phone-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="company">Company</label>
        <input type="text" id="company" name="company"
               maxlength="100"
               autocomplete="organization"
               placeholder="Acme Corp"
               aria-describedby="company-help"
               aria-errormessage="company-error">
        <span class="help-text" id="company-help">Optional — for business orders</span>
        <span class="error-message" id="company-error" role="alert"></span>
      </div>

      <div class="actions actions-end">
        <button type="submit" class="btn btn-primary" id="continue-btn">
          Continue to Payment →
        </button>
      </div>
    </form>
  </div>

  <script>
    // ── Simple Client-Side Validation ──
    const form = document.getElementById('contact-form');

    function validateField(input) {
      const errorEl = document.getElementById(input.id + '-error');
      if (!errorEl) return true;

      let msg = '';
      input.classList.remove('field-error');
      input.removeAttribute('aria-invalid');

      if (input.required && !input.value.trim()) {
        msg = input.labels?.[0]?.textContent?.replace(/\s*\*\s*$/, '') + ' is required';
      } else if (input.type === 'email' && input.value && !input.validity.valid) {
        msg = 'Please enter a valid email address';
      } else if (input.type === 'tel' && input.value && input.pattern && !new RegExp('^' + input.pattern + '$').test(input.value)) {
        msg = 'Please enter a valid phone number';
      } else if (input.minLength > 0 && input.value.length > 0 && input.value.length < input.minLength) {
        msg = `Must be at least ${input.minLength} characters`;
      }

      if (msg) {
        input.classList.add('field-error');
        input.setAttribute('aria-invalid', 'true');
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
        return false;
      }

      errorEl.textContent = '';
      errorEl.classList.remove('visible');
      return true;
    }

    // Validate on blur
    form.querySelectorAll('input').forEach(input => {
      input.addEventListener('blur', () => validateField(input));
      // Clear error on input
      input.addEventListener('input', () => {
        if (input.getAttribute('aria-invalid') === 'true') {
          validateField(input);
        }
      });
    });

    // Validate all on submit
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const inputs = form.querySelectorAll('input');
      let allValid = true;
      inputs.forEach(input => {
        if (!validateField(input)) allValid = false;
      });

      if (allValid) {
        window.location.href = '/demo/payment.html';
      }
    });
  </script>

  <!-- LucidSupport Widget -->
  <script>
    (function() {
      var s = document.createElement('script');
      s.src = '/widget/loader.js';
      s.setAttribute('data-site', 'demo');
      s.setAttribute('data-api', location.origin);
      s.setAttribute('data-position', 'bottom-right');
      s.setAttribute('data-theme', 'auto');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
