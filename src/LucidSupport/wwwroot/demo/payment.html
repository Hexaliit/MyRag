<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Details — LucidSupport Demo</title>
  <link rel="stylesheet" href="/demo/styles.css">
</head>
<body>
  <div class="page">
    <nav class="nav">
      <span class="nav-logo">LucidSupport Demo</span>
      <span class="nav-step">Step 2 of 2</span>
    </nav>

    <form id="payment-form" class="card" novalidate>
      <h1 class="card-title">Payment Details</h1>
      <p class="card-desc">Enter your card and billing information to complete the order.</p>

      <div class="form-group">
        <label for="card-number">Card Number <span class="required" aria-hidden="true">*</span></label>
        <input type="text" id="card-number" name="card-number"
               required
               autocomplete="cc-number"
               placeholder="4242 4242 4242 4242"
               maxlength="19"
               inputmode="numeric"
               aria-required="true"
               aria-describedby="card-number-help"
               aria-errormessage="card-number-error">
        <span class="help-text" id="card-number-help">16-digit card number — we accept Visa, Mastercard, and Amex</span>
        <span class="error-message" id="card-number-error" role="alert"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="expiry">Expiry Date <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="expiry" name="expiry"
                 required
                 autocomplete="cc-exp"
                 placeholder="MM/YY"
                 maxlength="5"
                 pattern="\d{2}/\d{2}"
                 inputmode="numeric"
                 aria-required="true"
                 aria-describedby="expiry-help"
                 aria-errormessage="expiry-error">
          <span class="help-text" id="expiry-help">Month and year (MM/YY)</span>
          <span class="error-message" id="expiry-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="cvv">CVV <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="cvv" name="cvv"
                 required
                 autocomplete="cc-csc"
                 placeholder="123"
                 maxlength="4"
                 pattern="\d{3,4}"
                 inputmode="numeric"
                 aria-required="true"
                 aria-describedby="cvv-help"
                 aria-errormessage="cvv-error">
          <span class="help-text" id="cvv-help">3 or 4 digit security code on your card</span>
          <span class="error-message" id="cvv-error" role="alert"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="billing-address">Billing Address <span class="required" aria-hidden="true">*</span></label>
        <input type="text" id="billing-address" name="billing-address"
               required minlength="5"
               autocomplete="address-line1"
               placeholder="123 Main Street"
               aria-required="true"
               aria-describedby="billing-address-help"
               aria-errormessage="billing-address-error">
        <span class="help-text" id="billing-address-help">Street address for billing</span>
        <span class="error-message" id="billing-address-error" role="alert"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="billing-city">City <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="billing-city" name="billing-city"
                 required minlength="2"
                 autocomplete="address-level2"
                 placeholder="San Francisco"
                 aria-required="true"
                 aria-errormessage="billing-city-error">
          <span class="error-message" id="billing-city-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="billing-postal">Postal Code <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="billing-postal" name="billing-postal"
                 required
                 autocomplete="postal-code"
                 placeholder="94102"
                 pattern="[A-Za-z0-9\s\-]{3,10}"
                 inputmode="text"
                 aria-required="true"
                 aria-describedby="billing-postal-help"
                 aria-errormessage="billing-postal-error">
          <span class="help-text" id="billing-postal-help">ZIP or postal code</span>
          <span class="error-message" id="billing-postal-error" role="alert"></span>
        </div>
      </div>

      <div class="actions">
        <a href="/demo/contact.html" class="btn btn-secondary" id="back-btn">← Back</a>
        <button type="submit" class="btn btn-primary" id="pay-btn">Pay Now</button>
      </div>
    </form>
  </div>

  <script>
    // ── Client-Side Validation ──
    const form = document.getElementById('payment-form');

    function validateField(input) {
      const errorEl = document.getElementById(input.id + '-error');
      if (!errorEl) return true;

      let msg = '';
      input.classList.remove('field-error');
      input.removeAttribute('aria-invalid');

      if (input.required && !input.value.trim()) {
        msg = input.labels?.[0]?.textContent?.replace(/\s*\*\s*$/, '') + ' is required';
      } else if (input.id === 'card-number' && input.value) {
        const digits = input.value.replace(/\s/g, '');
        if (!/^\d{13,19}$/.test(digits)) {
          msg = 'Please enter a valid card number (13-19 digits)';
        }
      } else if (input.id === 'expiry' && input.value) {
        if (!/^\d{2}\/\d{2}$/.test(input.value)) {
          msg = 'Please use MM/YY format';
        } else {
          const [mm] = input.value.split('/').map(Number);
          if (mm < 1 || mm > 12) msg = 'Month must be 01-12';
        }
      } else if (input.id === 'cvv' && input.value) {
        if (!/^\d{3,4}$/.test(input.value)) {
          msg = 'CVV must be 3 or 4 digits';
        }
      } else if (input.pattern && input.value && !new RegExp('^' + input.pattern + '$').test(input.value)) {
        msg = 'Please match the required format';
      } else if (input.minLength > 0 && input.value.length > 0 && input.value.length < input.minLength) {
        msg = `Must be at least ${input.minLength} characters`;
      }

      if (msg) {
        input.classList.add('field-error');
        input.setAttribute('aria-invalid', 'true');
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
        return false;
      }

      errorEl.textContent = '';
      errorEl.classList.remove('visible');
      return true;
    }

    // Auto-format card number with spaces
    const cardInput = document.getElementById('card-number');
    cardInput.addEventListener('input', () => {
      let val = cardInput.value.replace(/\D/g, '').substring(0, 16);
      cardInput.value = val.replace(/(\d{4})(?=\d)/g, '$1 ');
    });

    // Auto-format expiry with slash
    const expiryInput = document.getElementById('expiry');
    expiryInput.addEventListener('input', () => {
      let val = expiryInput.value.replace(/\D/g, '').substring(0, 4);
      if (val.length >= 2) val = val.substring(0, 2) + '/' + val.substring(2);
      expiryInput.value = val;
    });

    // Validate on blur
    form.querySelectorAll('input').forEach(input => {
      input.addEventListener('blur', () => validateField(input));
      input.addEventListener('input', () => {
        if (input.getAttribute('aria-invalid') === 'true') {
          validateField(input);
        }
      });
    });

    // Validate all on submit
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const inputs = form.querySelectorAll('input');
      let allValid = true;
      inputs.forEach(input => {
        if (!validateField(input)) allValid = false;
      });

      if (allValid) {
        alert('Payment submitted! (This is a demo — no real payment processed.)');
      }
    });
  </script>

  <!-- LucidSupport Widget -->
  <script>
    (function() {
      var s = document.createElement('script');
      s.src = '/widget/loader.js';
      s.setAttribute('data-site', 'demo');
      s.setAttribute('data-api', location.origin);
      s.setAttribute('data-position', 'bottom-right');
      s.setAttribute('data-theme', 'auto');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
