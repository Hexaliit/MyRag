# Artifact Generation Wave
# Generates physical artifacts (scene frames, text files, markdown documents).
# Creates evidence files for DocSummarizer integration and retrieval.

name: ArtifactGenerationWave
priority: 200
enabled: true

scope:
  sink: "videosummarizer"
  coordinator: "pipeline"
  atom: "artifact_generation"

triggers:
  requires:
    - signal: "video.normalized"
      condition: "HasValue"
  skip_when:
    - signal: "wave.skipped.ArtifactGenerationWave"

emits:
  on_start:
    - "artifact_generation.started"

  on_complete:
    - key: "artifacts.collection"
      type: "VideoArtifactCollection"
      description: "All generated artifacts"

    - key: "artifacts.markdown"
      type: "VideoArtifact"
      description: "Markdown document for DocSummarizer"

    - key: "artifacts.scene_frames"
      type: "List<VideoArtifact>"
      description: "Scene frame thumbnails"

    - key: "artifacts.text_files"
      type: "List<VideoArtifact>"
      description: "Generated text files (transcript, subtitles, OCR)"

  on_failure:
    - "artifact_generation.failed"

listens:
  required:
    - "video.metadata"
  optional:
    - "scenes.clusters"           # For scene frame generation
    - "keyframes.paths"           # For keyframe copying
    - "transcript.utterances"     # For transcript generation
    - "subtitles.utterances"      # For subtitle generation
    - "ocr.text_tracks"           # For OCR text export
    - "face_tracking.tracks"      # For entity section
    - "cast_members"              # For entity section
    - "external_metadata"         # For metadata section

config:
  bindings:
    - config_key: "artifacts.output_directory"
      default: "${VIDEO_DIR}/.artifacts"
    - config_key: "artifacts.scene_frames.enabled"
      default: true
    - config_key: "artifacts.markdown.enabled"
      default: true

# Artifact types generated by this wave
artifact_types:
  images:
    - SceneFrame
    - Keyframe
    - Filmstrip
    - FaceThumbnail

  text:
    - TranscriptTxt
    - TranscriptJson
    - SubtitleSrt
    - SubtitleVtt
    - OcrText
    - ChaptersTxt
    - MarkdownDocument

  audio:
    - AudioTrackProcessed
    - SpeechSegment

  analysis:
    - MediaInfoJson
    - ShotBoundaryJson
    - FaceEmbeddingsJson
    - DiarizationJson

output_structure:
  base: "${VIDEO_DIR}/.{video_name}_artifacts/"
  subdirs:
    scene_frames: "frames/"
    keyframes: "keyframes/"
    text: "text/"
    audio: "audio/"
    analysis: "analysis/"

tags:
  - "indexing"
  - "artifacts"
  - "docsummarizer"
  - "evidence"
